<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>adithya rajesh pillai</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Newsreader:opsz,wght@6..72,300;6..72,400;6..72,500&family=Manrope:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="shared.css">
  <style>
    /* ============================================================
       landing — variation A (sketch-faithful)
       ============================================================ */
    body[data-screen-label] { } /* placeholder */

    .stage {
      position: relative;
      min-height: 100vh;
      padding: clamp(2rem, 5vw, 4rem) clamp(2rem, 6vw, 5.5rem);
      overflow: hidden;
    }

    .layout {
      position: relative;
      z-index: 1;
      display: grid;
      grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
      gap: clamp(2rem, 6vw, 6rem);
      min-height: calc(100vh - 8rem);
      align-items: stretch;
    }

    /* left column */
    .left-col {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding-top: 1rem;
      gap: 2rem;
    }

    .photo-wrap {
      position: relative;
      width: clamp(240px, 32vw, 380px);
      aspect-ratio: 1;
    }

    .photo-wrap .profile-circle {
      width: 100%;
      height: 100%;
    }

    /* hand-drawn squiggle ring overlay */
    .photo-wrap svg.ring {
      position: absolute;
      inset: -18px;
      width: calc(100% + 36px);
      height: calc(100% + 36px);
      pointer-events: none;
    }

    /* corner sticker dot */
    .photo-wrap .sticker {
      position: absolute;
      top: -12px;
      right: -8px;
      width: 56px;
      height: 56px;
      transform: rotate(-12deg);
      pointer-events: none;
    }

    .identity {
      max-width: 30rem;
    }

    /* right column — nav */
    .right-col {
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: flex-end;
      padding-right: 0.5rem;
    }

    .right-col .nav-list {
      font-size: clamp(1rem, 1.4vw, 1.15rem);
      gap: 1.4rem;
    }

    /* decorative bits */
    .corner-arrow {
      position: absolute;
      top: 2.5rem;
      right: 3rem;
      font-family: var(--font-body);
      font-size: 0.72rem;
      letter-spacing: 0.2em;
      text-transform: lowercase;
      color: var(--brown);
      opacity: 0.55;
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .corner-arrow .scribble-arrow {
      width: 38px;
      height: 8px;
    }

    .signature {
      position: absolute;
      bottom: 1.6rem;
      left: 50%;
      transform: translateX(-50%);
      font-family: var(--font-body);
      font-size: 0.72rem;
      letter-spacing: 0.3em;
      text-transform: lowercase;
      color: var(--brown);
      opacity: 0.5;
    }

    .signature .dot {
      display: inline-block;
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: var(--green);
      margin: 0 0.6rem;
      vertical-align: middle;
    }

    /* floating tweaks toggle */
    .tweaks-open-btn {
      position: fixed;
      bottom: 1.5rem;
      right: 1.5rem;
      background: var(--brown);
      color: var(--bg);
      border: none;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      cursor: pointer;
      box-shadow: 3px 3px 0 var(--orange);
      z-index: 50;
      display: grid;
      place-items: center;
      transition: transform 0.2s ease;
    }
    .tweaks-open-btn:hover {
      transform: translateY(-2px) rotate(8deg);
    }
    .tweaks-open-btn svg { width: 22px; height: 22px; }

    /* responsive — stack on mobile */
    @media (max-width: 820px) {
      .stage { padding: 2rem 1.5rem 4rem; }
      .layout {
        grid-template-columns: 1fr;
        gap: 3rem;
        min-height: auto;
      }
      .left-col { gap: 2.5rem; }
      .photo-wrap {
        width: clamp(200px, 60vw, 280px);
      }
      .right-col {
        align-items: flex-start;
      }
      .right-col .nav-list {
        text-align: left;
        gap: 1.1rem;
      }
      .nav-list a::before {
        display: none;
      }
      .corner-arrow, .signature {
        display: none;
      }
    }
  </style>
</head>
<body class="paper-grain dot-grid">

  <main class="stage">
    <div class="layout">

      <!-- LEFT column -->
      <section class="left-col">

        <div class="photo-wrap">
          <div class="profile-circle" id="profile-circle">
            <div class="profile-placeholder">a</div>
          </div>
          <!-- wobbly hand-drawn ring -->
          <svg class="ring" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
            <path d="M50 4
                     C 75 4, 96 25, 96 50
                     C 96 75, 75 96, 50 96
                     C 25 96, 4 75, 4 50
                     C 4 25, 25 4, 50 4 Z"
                  stroke="#593512" stroke-width="0.55" stroke-linecap="round"
                  stroke-dasharray="0.6 1.8"
                  opacity="0.55"/>
          </svg>
        </div>

        <div class="identity">
          <h1 class="name">adithya rajesh<br/>pillai</h1>
          <p class="bio">
            researcher in cybersecurity, ai &amp; ml. experience with solutions
            and product engineering from startups and mncs.
          </p>
          <div class="socials" id="socials"></div>
        </div>

      </section>

      <!-- RIGHT column -->
      <aside class="right-col">
        <ul class="nav-list" id="nav-list"></ul>
      </aside>

    </div>
  </main>

  <!-- tweaks panel -->
  <button class="tweaks-open-btn" id="tweaks-open-btn" aria-label="open tweaks panel" title="tweaks">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="3"/>
      <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
    </svg>
  </button>
  <div class="tweaks-panel" id="tweaks-panel"></div>

  <script src="site.js"></script>
  <script>
    document.body.setAttribute("data-type", localStorage.getItem("typeChoice") || "serif");
    renderSocials("#socials");
    renderNav("#nav-list", { prefix: "", current: null });
    initTweaks();
  </script>
</body>
</html>
